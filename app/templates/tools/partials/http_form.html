<label for="http-target">URL</label>
<input
  id="http-target"
  name="target"
  type="url"
  inputmode="url"
  autocomplete="off"
  placeholder="https://example.com"
  required
  maxlength="2048"
>
<button type="submit" class="btn-primary">
  <span class="btn-label">Inspect</span>
  <span id="loading-http" class="spinner" aria-hidden="true"></span>
</button>
