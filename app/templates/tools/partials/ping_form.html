<label for="ping-target">Target</label>
<input
  id="ping-target"
  name="target"
  type="text"
  inputmode="text"
  autocomplete="off"
  placeholder="example.com or 8.8.8.8"
  required
  maxlength="253"
>
<button type="submit" class="btn-primary">
  <span class="btn-label">Run</span>
  <span id="loading-ping" class="spinner" aria-hidden="true"></span>
</button>
