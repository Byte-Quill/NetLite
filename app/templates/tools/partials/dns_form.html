<label for="dns-target">Hostname</label>
<input
  id="dns-target"
  name="target"
  type="text"
  inputmode="text"
  autocomplete="off"
  placeholder="example.com"
  required
  maxlength="253"
>
<button type="submit" class="btn-primary">
  <span class="btn-label">Lookup</span>
  <span id="loading-dns" class="spinner" aria-hidden="true"></span>
</button>
