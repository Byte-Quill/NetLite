<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NetLite - a lightweight local network diagnostics toolkit">
  <title>{% block title %}NetLite{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='vendor/htmx.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/alpine.min.js') }}"></script>
</head>
<body x-data="{ activeTool: null }">
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.index') }}" aria-label="NetLite home">
      <span class="brand-mark">↦</span>
      <span class="brand-name">NetLite</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ url_for('main.index') }}" {% if request.endpoint == 'main.index' %}aria-current="page"{% endif %}>Tools</a>
      <a href="{{ url_for('main.history') }}" {% if request.endpoint == 'main.history' %}aria-current="page"{% endif %}>History</a>
      <a href="{{ url_for('main.health') }}" {% if request.endpoint == 'main.health' %}aria-current="page"{% endif %}>Health</a>
    </nav>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>NetLite {{ version if version is defined else '' }} · local network toolkit</span>
    <span class="muted">Data never leaves this machine — requests are sent from your own host.</span>
  </footer>
</body>
</html>
