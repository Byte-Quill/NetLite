[project]
name = "netlite"
version = "0.1.0"
description = "Lightweight, self-hostable network diagnostics toolkit"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",  # line length is handled by formatter concerns; keep long URLs readable
    "RUF001",  # UI glyphs (tool icons) intentionally use ambiguous unicode
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true