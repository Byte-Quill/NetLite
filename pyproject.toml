[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netlite"
version = "0.1.0"
description = "Lightweight, self-hostable network diagnostics toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",  # line length is handled by formatter concerns; keep long URLs readable
    "RUF001",  # UI glyphs (tool icons) intentionally use ambiguous unicode
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true